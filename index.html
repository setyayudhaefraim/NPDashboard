<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard New Product Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1b1b33;--mute:#77778f;--line:#e4e1f3;--pri:#7c3aed;--pri-soft:#ede9fe;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding:20px}
.wrap{max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.code{color:var(--mute);font-size:14px}
h1{margin:4px 0 10px;font-size:34px;font-weight:800;letter-spacing:-.5px}
.meta{display:flex;gap:22px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.big{display:flex;align-items:center;gap:16px;margin-top:20px}
.big .bar{flex:1}.big strong{font-size:22px;font-weight:700}
.tabs{display:flex;gap:10px;margin:16px 0;overflow-x:auto;padding-bottom:6px}
.tab{flex:1 0 190px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.tab .r{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.tab .r span{color:var(--mute)}
.tab small{display:block;color:var(--mute);margin-top:8px;font-size:12px}
.tab.on{border:2px solid var(--pri);padding:13px 15px}
.bar.s{height:8px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.del{color:var(--bad)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.bar-actions{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;gap:10px;flex-wrap:wrap}
.bar-actions h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.part{padding:18px 20px}
.part h3{margin:0 0 4px;font-size:17px}
.part .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.sel{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sel select{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;font-size:13px}
.st{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.st output{text-align:right;color:var(--mute);font-weight:600}
input[type=range]{width:100%;accent-color:var(--pri)}
.tot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tot .bar{flex:1}.tot b{font-size:18px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--pri-soft);color:var(--pri)}
.row-b{display:flex;gap:8px;margin-top:12px}
.empty{padding:36px;text-align:center;color:var(--mute)}
dialog{border:none;border-radius:16px;padding:24px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(40,20,90,.25)}
dialog::backdrop{background:rgba(27,27,51,.4)}
dialog h3{margin:0 0 14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
dialog input,dialog select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note{color:var(--mute);font-size:12px;margin-top:18px;text-align:center}
@media(max-width:520px){.st{grid-template-columns:100px 1fr 40px}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 14px}
.fl{display:block;font-size:13px;color:var(--mute);margin:8px 0}
.fl input,.fl select,.fl textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.full{grid-column:1/-1}
.sec{margin-top:14px}.sec h2{margin:0 0 6px;font-size:19px}.sec h4{margin:18px 0 4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:600;padding:6px}
td{padding:3px}
td input{width:100%;min-width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
td input[type=checkbox]{width:auto;min-width:0}
.rt{white-space:nowrap;font-weight:600;text-align:right}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px}
.tt{text-align:right;margin-top:8px}
.tt b{font-size:16px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.sum div{background:var(--pri-soft);border-radius:12px;padding:12px}
.sum span{display:block;font-size:12px;color:var(--mute)}
.sum b{font-size:17px}
@media print{#dash,.noprint,dialog{display:none!important}body{background:#fff;padding:0}.x,[data-add]{display:none}}
.rek{margin-top:14px;border-radius:12px;padding:14px 16px;border-left:5px solid var(--mute);background:#f3f2f8}
.rek.ok{border-color:var(--ok);background:#ecf8f0}.rek.warn{border-color:var(--warn);background:#fdf5e8}.rek.bad{border-color:var(--bad);background:#fdeeee}
.rek b{font-size:16px}.rek ul{margin:6px 0 0;padding-left:18px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="dash">
  <header class="card">
    <div class="top">
      <div>
        <div class="code">NPD-2026</div>
        <h1>NEW PRODUCT DEVELOPMENT</h1>
        <div class="meta">
          <span>Department <b>R&amp;D</b></span>
          <span>Pilar <b>New Product Development</b></span>
          <span>Total part <b id="cnt">0</b></span>
        </div>
      </div>
      <div class="row-b" style="margin:0">
        <button class="btn" id="exp">Ekspor</button>
        <button class="btn" id="imp">Impor</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
    </div>
    <div class="big"><div class="bar"><i id="allbar"></i></div><strong id="allpct">0%</strong></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Kategori"></nav>

  <div class="bar-actions">
    <h2 id="catTitle"></h2>
    <button class="btn pri" id="add">Tambah part</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Data tersimpan di browser ini. Gunakan Ekspor untuk cadangan atau memindahkan data ke perangkat lain.</p>
</div>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3 id="dtitle">Tambah part</h3>
    <label for="fname">Nama part</label>
    <input id="fname" required placeholder="Contoh: Gasket racing Supra GTR">
    <label for="fpic">PIC</label>
    <input id="fpic" placeholder="Nama penanggung jawab">
    <label for="fcat">Kategori</label>
    <select id="fcat"></select>
    <label for="fprio">Prioritas</label>
    <select id="fprio"><option>Rendah</option><option>Sedang</option><option>Tinggi</option></select>
    <div class="foot">
      <button class="btn" type="button" id="cancel">Batal</button>
      <button class="btn pri" type="submit">Simpan</button>
    </div>
  </form>
</dialog>
<div class="wrap" id="fsrv" hidden></div>

<script>
const STAGES = ["Studi","Technical Design","Purchasing","Pengerjaan Teknis","Trial"];
const CATS = [
  {id:"racing",name:"Racing"},
  {id:"r2",name:"Harian R2"},
  {id:"r4",name:"Harian R4"},
  {id:"statis",name:"Mesin Statis"}
];
const STATUS = ["Belum mulai","Berjalan","Selesai","Tertunda"];
const KEY = "npd-dashboard-v1";

const SAMPLE = [
  {id:1,cat:"racing",name:"Gasket racing Supra GTR",pic:"",status:"Berjalan",prio:"Tinggi",stages:[100,80,60,20,0]},
  {id:2,cat:"racing",name:"Piston forged 5TP",pic:"",status:"Berjalan",prio:"Tinggi",stages:[100,100,100,70,0]},
  {id:3,cat:"r2",name:"Contoh part harian R2",pic:"",status:"Belum mulai",prio:"Sedang",stages:[30,0,0,0,0]},
  {id:4,cat:"r4",name:"Contoh part harian R4",pic:"",status:"Belum mulai",prio:"Sedang",stages:[0,0,0,0,0]},
  {id:5,cat:"statis",name:"Contoh part mesin statis",pic:"",status:"Belum mulai",prio:"Rendah",stages:[0,0,0,0,0]}
];

function load(){
  try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
  return JSON.parse(JSON.stringify(SAMPLE));
}
let parts = load();
let cat = CATS[0].id;
let editId = null;

function save(){try{localStorage.setItem(KEY,JSON.stringify(parts))}catch(e){}}
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const pPct = p => avg(p.stages);
const fmt = n => (Math.round(n*10)/10).toString().replace(".",",") + "%";
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

function render(){
  $("cnt").textContent = parts.length;
  const all = avg(parts.map(pPct));
  $("allbar").style.width = all+"%";
  $("allpct").textContent = fmt(all);

  $("tabs").innerHTML = CATS.map(c=>{
    const ps = parts.filter(p=>p.cat===c.id);
    const v = avg(ps.map(pPct));
    return `<button class="tab ${c.id===cat?"on":""}" data-cat="${c.id}">
      <div class="r">${c.name}<span>${fmt(v)}</span></div>
      <div class="bar s"><i style="width:${v}%"></i></div>
      <small>${ps.length} part</small></button>`;
  }).join("");

  const cur = CATS.find(c=>c.id===cat);
  $("catTitle").textContent = "Part " + cur.name;
  const list = parts.filter(p=>p.cat===cat);
  $("grid").innerHTML = list.length ? list.map(partHTML).join("")
    : `<div class="card empty" style="grid-column:1/-1">Belum ada part di kategori ini. Klik Tambah part untuk memulai.</div>`;
}

function partHTML(p){
  const v = pPct(p);
  return `<article class="card part" data-id="${p.id}">
    <h3>${esc(p.name)} ${p.fsr&&p.fsr.keputusan&&p.fsr.keputusan!=='Belum diputuskan'?`<span class="pill">${esc(p.fsr.keputusan)}</span>`:''}</h3>
    <div class="sub">${p.pic ? "PIC "+esc(p.pic) : "PIC belum diisi"}</div>
    <div class="sel">
      <select data-f="status" aria-label="Status">${STATUS.map(s=>`<option ${s===p.status?"selected":""}>${s}</option>`).join("")}</select>
      <select data-f="prio" aria-label="Prioritas">${["Rendah","Sedang","Tinggi"].map(s=>`<option ${s===p.prio?"selected":""}>${s}</option>`).join("")}</select>
    </div>
    ${STAGES.map((s,i)=>`<div class="st"><span>${s}</span>
      <input type="range" min="0" max="100" step="5" value="${p.stages[i]}" data-i="${i}" aria-label="${s}">
      <output>${p.stages[i]}%</output></div>`).join("")}
    <div class="tot"><div class="bar"><i style="width:${v}%"></i></div><b>${fmt(v)}</b></div>
    <div class="row-b">
      <button class="btn pri" data-act="fsr">FSR</button>
      <button class="btn" data-act="edit">Edit</button>
      <button class="btn del" data-act="del">Hapus</button>
    </div>
  </article>`;
}

// tab
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  cat=b.dataset.cat; render();
});

// slider: update label saat digeser, render ulang saat dilepas
$("grid").addEventListener("input",e=>{
  if(e.target.type!=="range") return;
  const p=parts.find(x=>x.id==e.target.closest(".part").dataset.id);
  p.stages[e.target.dataset.i]=+e.target.value;
  e.target.nextElementSibling.textContent=e.target.value+"%";
});
$("grid").addEventListener("change",e=>{
  const art=e.target.closest(".part"); if(!art) return;
  const p=parts.find(x=>x.id==art.dataset.id);
  if(e.target.dataset.f) p[e.target.dataset.f]=e.target.value;
  save(); render();
});
$("grid").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const id=+b.closest(".part").dataset.id;
  if(b.dataset.act==="del"){
    const p=parts.find(x=>x.id===id);
    if(confirm(`Hapus part "${p.name}"?`)){parts=parts.filter(x=>x.id!==id);save();render();}
  } else if(b.dataset.act==="fsr") openFsr(id); else openDlg(id);
});

// dialog
$("fcat").innerHTML = CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
function openDlg(id){
  editId=id||null;
  const p=id?parts.find(x=>x.id===id):null;
  $("dtitle").textContent = p?"Edit part":"Tambah part";
  $("fname").value=p?p.name:"";
  $("fpic").value=p?p.pic:"";
  $("fcat").value=p?p.cat:cat;
  $("fprio").value=p?p.prio:"Sedang";
  $("dlg").showModal();
}
$("add").onclick=()=>openDlg();
$("cancel").onclick=()=>$("dlg").close();
$("frm").addEventListener("submit",()=>{
  const d={name:$("fname").value.trim(),pic:$("fpic").value.trim(),cat:$("fcat").value,prio:$("fprio").value};
  if(!d.name) return;
  if(editId){Object.assign(parts.find(x=>x.id===editId),d);}
  else parts.push({id:Date.now(),status:"Belum mulai",stages:[0,0,0,0,0],...d});
  cat=d.cat; save(); render();
});

// ekspor / impor
$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(parts,null,2)],{type:"application/json"}));
  a.download="npd-dashboard.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      parts=d; save(); render();
    }catch(_){alert("File tidak valid. Gunakan file hasil Ekspor.");}
  };
  r.readAsText(f); e.target.value="";
};

/* ===== FSR (Studi Kelayakan) ===== */
const num=v=>parseFloat(v)||0;
const frac=s=>{s=String(s==null?"":s).trim();if(s.includes("/")){const[a,b]=s.split("/");return num(a)/(num(b)||1)}return num(s)};
const rp=n=>"Rp "+(n||0).toLocaleString("id-ID",{maximumFractionDigits:2});
const sum=(a,fn)=>a.reduce((t,r)=>t+fn(r),0);
const pe=r=>num(r.kwh)*num(r.dt)/3600*num(f.tarif);
const PC=[["n","Proses / pengujian"],["m","Alat / mesin"],["kwh","kWh","n"],["dt","Durasi (detik)","n"],["b","Bahan (Rp)","n"]];
const MC=[["n","Mesin"],["d","Deskripsi"],["q","Qty","n"],["h","Harga satuan","n"]];
const NC=[["n","Jabatan"],["bg","Bagian"],["umk","UMK (Rp)","n"],["qty","Qty MP","n"],["dt","Durasi (detik)","n"]];
const TBL={
 bench:[[["n","Brand / merk"],["h","Harga (Rp)","n"],["m","Material"],["c","Catatan"]],0],
 mat:[[["n","Material"],["d","Deskripsi"],["s","Satuan"],["h","Harga / satuan","n"],["q","Qty (mis. 1/25)"],["on","Pakai","c"]],"mat"],
 proc:[PC,"pc"],mesinP:[MC,"mes"],manP:[NC,"man"],
 qp:[[["n","Pengujian"],["s","Standar"],["ref","Referensi"]],0],
 uji:[PC,"pc"],mesinQ:[MC,"mes"],manQ:[NC,"man"],
 pk:[PC,"pc"],mesinK:[MC,"mes"],manK:[NC,"man"],
 inv:[[["n","Item"],["d","Deskripsi"],["v","Biaya (Rp)","n"]],"inv"]
};
const CF={mat:r=>r.on===false?0:num(r.h)*frac(r.q),pc:r=>pe(r)+num(r.b),man:r=>num(r.umk)/160/3600*num(r.qty)*num(r.dt),mes:r=>num(r.q)*num(r.h),inv:r=>num(r.v)};
const TTD=[["pm","Plant Manager","Hendra Mardi Immanuel"],["ppic","PPIC","Fajar"],["qc","QC","Ayom Kurniawan"],["prod","Produksi","Hariyono"],["rek","Rekayasa","Wiryo"],["rnd","R&amp;D (pembuat)","Irwansyah"],["adv","Advisor","Agus Susilo"],["ceo","CEO","Agung Heryan Widigdo"]];
const mp=a=>a.map(([n,umk,bg])=>({n,umk,bg,qty:0,dt:0}));
const NF=()=>{const o={nama:"",pnO:"",pnI:"",kat:"",market:"",fungsi:"",aplikasi:"",bench:[{},{},{}],manuf:"Internal perusahaan",ref:"Benchmark",refN:"",
 mat:[{on:true}],proc:[{}],mesinP:[{}],manP:mp([["Plant Manager",15500000,"All section"],["Manager",12500000,"Produksi"],["Spv",8500000,"Produksi"],["Operator",5200000,"Proses 1"]]),
 qp:[{}],uji:[{}],mesinQ:[{}],manQ:mp([["Manager",12500000,"QC"],["Spv",8500000,"QC"],["Operator",5200000,"QC"]]),
 kemas:"Plastik",fin:"Transparan",dim:"",refK:"",pk:[{}],mesinK:[{}],manK:mp([["Spv",8500000,"Kemas"],["Operator",5200000,"Kemas"]]),
 inv:[{n:"Tempat produksi"},{n:"Biaya studi"},{n:"Pembelian sampel"}],jam:7,shf:3,hr:5,mg:4,
 tarif:2415,batch:100,ovh:20,margin:30,dem:"",maxb:1,keputusan:"Belum diputuskan",catatan:""};
 TTD.forEach(t=>o["t_"+t[0]]=t[2]);return o};
let f,fid;
const fi=(l,k,t="text")=>`<label class="fl">${l}<input data-b="${k}" type="${t}" ${t==="number"?'step="any"':""} value="${esc(f[k]??"")}"></label>`;
const fs=(l,k,o)=>`<label class="fl">${l}<select data-b="${k}">${o.map(x=>`<option ${x===f[k]?"selected":""}>${x}</option>`).join("")}</select></label>`;
const ft=(l,k)=>`<label class="fl full">${l}<textarea data-b="${k}" rows="3">${esc(f[k]??"")}</textarea></label>`;
const sec=(t,h)=>`<section class="card sec"><h2>${t}</h2>${h}</section>`;
const tb=k=>{const[cols,cf]=TBL[k];
 return `<div class="tw"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}${cf?"<th>Biaya</th>":""}<th></th></tr>${f[k].map((r,i)=>`<tr>${cols.map(c=>`<td><input data-t="${k}" data-i="${i}" data-k="${c[0]}" aria-label="${c[1]}" ${c[2]==="c"?`type="checkbox" ${r[c[0]]!==false?"checked":""}`:`type="${c[2]==="n"?"number":"text"}" ${c[2]==="n"?'step="any"':""} value="${esc(r[c[0]]??"")}"`}></td>`).join("")}${cf?`<td class="rt" data-r="${k}.${i}"></td>`:""}<td><button type="button" class="x" data-del="${k}.${i}" aria-label="Hapus baris">✕</button></td></tr>`).join("")}</table></div><div class="row-b noprint"><button type="button" class="btn" data-add="${k}">Tambah baris</button></div>${cf?`<div class="tt">${k==="uji"||k==="manQ"?"Total per pcs (÷ batch)":"Total"} <b data-o="t_${k}"></b></div>`:""}`};
const h4=t=>`<h4>${t}</h4>`;

function openFsr(id){fid=id;const p=parts.find(x=>x.id===id);f=p.fsr||(p.fsr=NF());f.nama=f.nama||p.name;
 $("dash").hidden=true;$("fsrv").hidden=false;build();scrollTo(0,0)}

function build(){
 const p=parts.find(x=>x.id===fid),cn=CATS.find(c=>c.id===p.cat).name;
 const row=(l,k)=>`<tr><td>${l}</td>${["mat","mes","man","tot"].map(y=>`<td class="rt" data-o="${k}.${y}"></td>`).join("")}</tr>`;
 $("fsrv").innerHTML=`<header class="card"><div class="top"><div><div class="code">Studi kelayakan produk / bisnis baru</div><h1>${esc(p.name)}</h1>
 <div class="meta"><span>Jenis <b>${cn}</b></span><span>Kelengkapan form <b data-o="comp"></b></span></div></div>
 <div class="row-b noprint" style="margin:0"><button class="btn" data-fa="print">Cetak / PDF</button><button class="btn pri" data-fa="back">Kembali ke dashboard</button></div></div></header>`
 +sec("A. Identifikasi produk",`<div class="fg">${fi("Nama produk (IMSG)","nama")}${fi("P/N original","pnO")}${fi("P/N IMSG","pnI")}${fi("Kategori produk","kat")}${fi("Market produk","market")}${ft("Fungsi produk","fungsi")}${ft("Aplikasi produk","aplikasi")}</div>${h4("Benchmarking")}${tb("bench")}`)

function recalc(){
 const S={};
 for(const k in TBL){const cf=CF[TBL[k][1]];if(!cf)continue;S[k]=0;
  f[k].forEach((r,i)=>{const v=cf(r);S[k]+=v;const e=document.querySelector(`[data-r="${k}.${i}"]`);if(e)e.textContent=rp(v)})}
 const bt=num(f.batch)||1;
 const G={prod:{mat:S.mat,mes:S.proc,man:S.manP},q:{mat:0,mes:S.uji/bt,man:S.manQ/bt},k:{mat:sum(f.pk,r=>num(r.b)),mes:sum(f.pk,pe),man:S.manK}};
 const O={};let c1=0;
 for(const x in G){const g=G[x];g.tot=g.mat+g.mes+g.man;c1+=g.tot;for(const y in g)O[x+"."+y]=rp(g[y])}
 const inv=S.mesinP+S.mesinQ+S.mesinK+S.inv,hpp=c1*(1+num(f.ovh)/100),hj=hpp*(1+num(f.margin)/100),cm=hj-hpp;
 Object.assign(O,{c1:rp(c1),inv:rp(inv),hpp:rp(hpp),hj:rp(hj),cm:rp(cm)});
 for(const k in S)O["t_"+k]=rp(k==="uji"||k==="manQ"?S[k]/bt:S[k]);
 [1,2,3].forEach(y=>{const t=cm>0?inv/cm/y:null;O["b"+y]=t==null?"-":t.toFixed(1)+" pcs/tahun";O["bm"+y]=t==null?"":(t/12).toFixed(1)+" pcs/bulan"});
 const bn=Math.max(0,...f.proc.map(r=>num(r.dt))),kS=bn?num(f.jam)*3600/bn:0,kH=kS*num(f.shf),kM=kH*num(f.hr),kB=kM*num(f.mg),nf=n=>Math.round(n).toLocaleString("id-ID");
 Object.assign(O,{kS:nf(kS)+" pcs",kH:nf(kH)+" pcs",kM:nf(kM)+" pcs",kB:nf(kB)+" pcs",bn:bn?bn+" detik/pcs":"isi durasi proses dulu"});
 const bp=f.bench.map(r=>num(r.h)).filter(x=>x>0),mx=bp.length?Math.max(...bp):0,my=num(f.maxb)||1,tg=cm>0?inv/cm/my/12:0,kb=kB,dm=num(f.dem);
 let st="ok",lb="Layak untuk dilanjutkan";const rs=[];
 const bad=m=>{st="bad";rs.push("✗ "+m)},warn=m=>{if(st!=="bad")st="warn";rs.push("! "+m)},good=m=>rs.push("✓ "+m),info=m=>rs.push("• "+m);
 if(!c1){st="";lb="Belum ada data untuk dinilai";info("Isi material, proses, dan manpower terlebih dahulu.")}
 else{
  if(cm<=0)bad("Contribution margin tidak positif: harga jual belum menutup HPP.");else good("Contribution margin positif ("+rp(cm)+" per pcs).");
  if(!mx)info("Isi harga benchmarking di bagian A untuk membandingkan harga jual.");
  else if(hj>mx)warn("Harga jual "+rp(hj)+" di atas benchmark tertinggi "+rp(mx)+".");
  else good("Harga jual "+rp(hj)+" di bawah benchmark tertinggi "+rp(mx)+".");
  if(cm>0){
   const t=tg.toFixed(1)+" pcs/bulan";
   if(!kb)info("Isi kapasitas per bulan (C3) untuk menguji target BEP.");
   else if(tg>kb)bad("Target BEP "+my+" tahun ("+t+") melebihi kapasitas produksi "+kb+" pcs/bulan.");
   else good("Target BEP "+my+" tahun ("+t+") masih dalam kapasitas "+kb+" pcs/bulan.");
   if(dm>0){if(tg>dm)warn("Target BEP ("+t+") melebihi estimasi permintaan "+dm+" pcs/bulan.");else good("Target BEP masih di bawah estimasi permintaan.")}
   else info("Isi estimasi permintaan per bulan untuk menguji kebutuhan pasar.");
  }
  if(st==="warn")lb="Pertimbangkan ulang";if(st==="bad")lb="Tidak layak";
 }
 const rk=document.querySelector("[data-rek]");if(rk){rk.className="rek "+st;rk.innerHTML="<b>Rekomendasi: "+lb+"</b><ul>"+rs.map(x=>"<li>"+x+"</li>").join("")+"</ul>"}
 const ck=[f.nama,f.pnO,f.fungsi,f.aplikasi,f.bench.some(r=>r.n),f.mat.some(r=>r.n),f.proc.some(r=>r.n),f.qp.some(r=>r.n),f.dim||f.refK,f.keputusan!=="Belum diputuskan"];
 const comp=Math.round(ck.filter(Boolean).length/ck.length*100);
 O.comp=comp+"%";
 parts.find(x=>x.id===fid).stages[0]=Math.round(comp/5)*5;
 document.querySelectorAll("[data-o]").forEach(e=>e.textContent=O[e.dataset.o]??"");
 save()}

 else if(d.del){const[k,i]=d.del.split(".");f[k].splice(+i,1);build()}

render();
